name: Labi News & Daily Survey Launcher 🐰🚀

on:
  schedule:
    # 🌅 朝の便 (JST 8:14 -> UTC 23:14) 
    # ※GitHubの大渋滞を避けるため、あえて中途半端な「14分」に設定らび！
    - cron: '14 23 * * *'
    
    # ☀️🌙 昼・夕方の便 (JST 12:14, 17:14 -> UTC 3:14, 8:14)
    - cron: '14 3,8 * * *'
  workflow_dispatch: # 手動実行も可能らび！

permissions:
  contents: write

jobs:
  post-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: "${{ secrets.VITE_SUPABASE_URL }}"
      VITE_SUPABASE_ANON_KEY: "${{ secrets.VITE_SUPABASE_ANON_KEY }}"
      SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
      GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm install

      - name: Run Auto News Poster Script 🥕
        run: node scripts/auto_latest_news.cjs

      - name: Generate Sitemap & Feed 🗺️
        run: |
          node scripts/generate_sitemap.cjs
          node scripts/generate_feed.cjs

      - name: Commit and Push Sitemap & Feed 🚀
        run: |
          git config --global user.name "Labi Bot"
          git config --global user.email "labi-bot@users.noreply.github.com"
          git add public/sitemap.xml public/atom.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update sitemap and feed [skip ci]" && git push)
