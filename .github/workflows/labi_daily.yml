name: Labi News & Daily Survey Launcher 🐰🚀

on:
  schedule:
    # 朝・昼・夕方・夜の4回実行らびっ！ 🐰🚀
    # (JST 6:45, 11:45, 17:45, 21:45 -> UTC 21:45, 2:45, 8:45, 12:45)
    # ※GitHubの実行待ち渋滞を考慮して、目標時間（7時, 12時, 18時, 22時台）の約30分前に発火させます
    - cron: '45 21,2,8,12 * * *'
  workflow_dispatch: # 手動実行も可能らび！

permissions:
  contents: write

jobs:
  post-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: "${{ secrets.VITE_SUPABASE_URL }}"
      VITE_SUPABASE_ANON_KEY: "${{ secrets.VITE_SUPABASE_ANON_KEY }}"
      SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
      GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm install

      - name: Run Auto News Poster Script 🥕
        run: node scripts/auto_latest_news.cjs

      - name: Generate Sitemap & Feed 🗺️
        run: |
          node scripts/generate_sitemap.cjs
          node scripts/generate_feed.cjs

      - name: Commit and Push Sitemap & Feed 🚀
        run: |
          git config --global user.name "Labi Bot"
          git config --global user.email "labi-bot@users.noreply.github.com"
          git add public/sitemap.xml public/atom.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update sitemap and feed [skip ci]" && git push)
